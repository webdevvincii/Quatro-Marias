<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quatro Marías Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-200">

    <!-- Sidebar -->
    <aside class="fixed top-0 left-0 w-64 h-full bg-gray-800 p-5">
        <h2 class="text-white text-xl font-bold mb-4">Menu</h2>
        <ul>
            <li><button class="category-btn w-full text-left py-2 px-3 hover:bg-gray-700 rounded active" data-category="pasta">Noodles/Pasta</button></li>
            <li><button class="category-btn w-full text-left py-2 px-3 hover:bg-gray-700 rounded" data-category="pork">Pork</button></li>
            <li><button class="category-btn w-full text-left py-2 px-3 hover:bg-gray-700 rounded" data-category="veggies">Veggies</button></li>
            <li><button class="category-btn w-full text-left py-2 px-3 hover:bg-gray-700 rounded" data-category="lumpia">Lumpia</button></li>
            <li><button class="category-btn w-full text-left py-2 px-3 hover:bg-gray-700 rounded" data-category="chicken">Chicken</button></li>
            <li><button class="category-btn w-full text-left py-2 px-3 hover:bg-gray-700 rounded" data-category="beef">Beef</button></li>
            <li><button class="category-btn w-full text-left py-2 px-3 hover:bg-gray-700 rounded" data-category="seafood">Seafood</button></li>
            <li><button class="category-btn w-full text-left py-2 px-3 hover:bg-gray-700 rounded" data-category="dessert">Dessert</button></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="relative z-10 ml-64 flex-1 p-5">
        <h1 class="text-2xl font-bold mb-4">Our Menu</h1>

        <!-- Dynamic Product Grid -->
        <div id="grid-container" class="grid grid-cols-4 gap-4 p-4">
            <!-- Items will be inserted here dynamically -->
        </div>
    </main>

    <!-- JavaScript for Dynamic Category Loading -->
    <script src="menu.js"> </script>

</body>
</html>
