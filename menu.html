<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quatro Marias</title>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>
    emailjs.init("5obXeDWePS9pXWCcz");
  </script>

  <!-- Assets -->
  <link rel="icon" href="quatro.png" type="image/png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="relative h-screen">
  
  <!-- ===== Background Layers ===== -->
  <div class="fixed inset-0 bg-[url('background.jpg')] bg-cover bg-center"></div>
  <div class="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-lg"></div>

  <!-- ===== HEADER ===== -->
  <header class="fixed top-0 left-0 w-full z-50 text-white backdrop-blur-lg">
    <div class="container mx-auto relative flex justify-center items-center p-4">
      
      <!-- Go Back (Desktop) -->
      <a href="index.html#homeSection" class="hidden lg:block absolute mr-[1100px]">
        <span class="text-xl font-semibold">&lt; Go Back</span>
      </a>

      <!-- Logo -->
      <div class="flex items-center space-x-3">
        <a href="index.html#homeSection" class="flex items-center space-x-3">
          <span class="lg:hidden absolute text-lg font-semibold left-4">&lt; Back</span>
          <img src="quatro.png" class="h-10 w-auto object-contain" alt="Logo" />
          <span class="text-xl font-semibold">Quatro Marias</span>
        </a>
      </div>

      <!-- Hamburger Button (Mobile) -->
      <button id="menuToggle" class="lg:hidden absolute focus:outline-none right-4">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </header>

  <!-- ===== MOBILE MENU ===== -->
  <div id="mobileMenu"
    class="fixed inset-0 w-full h-screen bg-black/80 backdrop-blur-lg text-white flex flex-col items-center justify-center space-y-8 transform translate-x-full transition-transform duration-300 ease-in-out lg:hidden z-40">
    <button id="closeMobileMenu" class="absolute top-6 right-10 text-4xl font-bold hover:text-red-500">&times;</button>

    <h2 class="text-2xl font-semibold text-gray-200">Menu</h2>
    <ul>
      <li><button class="category-btn w-full text-center text-xl py-2 px-3 mb-2" id="pasta" data-category="pasta">Noodles/Pasta</button></li>
      <li><button class="category-btn w-full text-center text-xl py-2 px-3 mb-2" id="pork" data-category="pork">Pork</button></li>
      <li><button class="category-btn w-full text-center text-xl py-2 px-3 mb-2" id="veggies" data-category="veggies">Veggies</button></li>
      <li><button class="category-btn w-full text-center text-xl py-2 px-3 mb-2" id="lumpia" data-category="lumpia">Lumpia</button></li>
      <li><button class="category-btn w-full text-center text-xl py-2 px-3 mb-2" id="chicken" data-category="chicken">Chicken</button></li>
      <li><button class="category-btn w-full text-center text-xl py-2 px-3 mb-2" id="beef" data-category="beef">Beef</button></li>
      <li><button class="category-btn w-full text-center text-xl py-2 px-3 mb-2" id="seafood" data-category="seafood">Seafood</button></li>
      <li><button class="category-btn w-full text-center text-xl py-2 px-3 mb-2" id="dessert" data-category="dessert">Dessert</button></li>
    </ul>
  </div>

  <!-- ===== SIDEBAR (Desktop) ===== -->
  <aside id="sidebar"
    class="hidden lg:block fixed mt-24 text-center w-64 h-4/4 bg-gray-500 text-white bg-opacity-30 backdrop-blur-lg p-5 rounded shadow-lg transition-all duration-300">
    
    <!-- Menu Content -->
    <div id="menu-content">
      <h2 class="text-xl font-semibold text-gray-200 mb-4">Menu</h2>
      <p class="text-xs mb-5 text-gray-400 font-medium">Kindly Order at least 1 day in advance</p>
      <ul>
        <li><button id="pasta" class="category-btn w-full text-left py-2 px-3 hover:bg-gray-700 rounded" data-category="pasta">Noodles/Pasta</button></li>
        <li><button id="pork" class="category-btn w-full text-left py-2 px-3 hover:bg-gray-700 rounded" data-category="pork">Pork</button></li>
        <li><button id="veggies" class="category-btn w-full text-left py-2 px-3 hover:bg-gray-700 rounded" data-category="veggies">Veggies</button></li>
        <li><button id="lumpia" class="category-btn w-full text-left py-2 px-3 hover:bg-gray-700 rounded" data-category="lumpia">Lumpia</button></li>
        <li><button id="chicken" class="category-btn w-full text-left py-2 px-3 hover:bg-gray-700 rounded" data-category="chicken">Chicken</button></li>
        <li><button id="beef" class="category-btn w-full text-left py-2 px-3 hover:bg-gray-700 rounded" data-category="beef">Beef</button></li>
        <li><button id="seafood" class="category-btn w-full text-left py-2 px-3 hover:bg-gray-700 rounded" data-category="seafood">Seafood</button></li>
        <li><button id="dessert" class="category-btn w-full text-left py-2 px-3 hover:bg-gray-700 rounded" data-category="dessert">Dessert</button></li>
      </ul>

      <!-- View Cart -->
      <button id="view-cart-btn"
        class="w-full mt-5 bg-red-600 hover:bg-red-500 text-white py-2 rounded-lg transition relative">
        🛒 View My Cart
        <span id="cart-count"
          class="absolute -top-2 right-0 bg-white text-red-500 text-md font-medium px-2 rounded-full hidden">0</span>
      </button>
    </div>

    <!-- Cart Content -->
    <div id="cart-content" class="hidden">
      <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <h2 class="text-lg text-gray-200 font-semibold">🛒 My Cart</h2>
        <button id="back-to-menu" class="text-white text-2xl -mt-4">&times;</button>
      </div>
      <div id="cart-items" class="space-y-2 max-h-[370px] overflow-y-auto p-3">
        <p class="text-gray-400 text-center">Your cart is empty.</p>
      </div>
      <div class="mt-3 border-t border-gray-700 pt-3">
        <p class="text-white font-semibold text-center">Total: <span id="cart-total">P 0.00</span></p>
        <button id="checkout-btn" class="w-full mt-2 bg-red-600 hover:bg-red-500 text-white py-2 rounded-lg transition">Checkout</button>
      </div>
    </div>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="relative z-10 lg:ml-64 flex-1 p-5">
    <div id="grid-container" class="grid grid-cols-1 gap-3 p-4 mt-10">
      <!-- Items dynamically inserted -->
    </div>
  </main>

  <!-- ===== CHECKOUT FORM ===== -->
  <div id="checkout-form"
    class="hidden fixed w-full h-full inset-0 bg-black bg-opacity-50 backdrop-blur-sm flex justify-center items-center top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-[9999]">
    <div class="bg-gray-900 p-6 rounded-lg w-96 shadow-lg">
      <h2 class="text-lg text-white font-semibold text-center mb-4">Checkout Form</h2>
      <p class="text-sm text-gray-400 font-semibold text-center mb-4">📌 Kindly Order at least 1 day in advance</p>
      <form id="order-form">
        <label class="text-white text-sm">Name:</label>
        <input type="text" id="customer-name" class="w-full p-2 mb-3 bg-gray-800 text-white rounded" required />

        <label class="text-white text-sm">Contact Number:</label>
        <input type="text" id="customer-phone" class="w-full p-2 mb-3 bg-gray-800 text-white rounded" required />

        <label class="text-white text-sm">Address <span class="text-gray-400">(📌PPC only!)</span>:</label>
        <textarea id="customer-address" class="w-full p-2 mb-3 bg-gray-800 text-white rounded"></textarea>

        <label class="text-white text-sm">Message <span class="text-gray-400">(Optional)</span>:</label>
        <textarea id="customer-message" class="w-full p-2 mb-3 bg-gray-800 text-white rounded"></textarea>

        <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white py-2 rounded-lg transition">Submit Order</button>
        <button type="button" id="cancel-checkout" class="w-full mt-2 bg-gray-700 hover:bg-gray-600 text-white py-2 rounded-lg transition">Cancel</button>
      </form>
    </div>
  </div>


  <!-- Floating Cart Button -->
<button id="floating-cart-btn" 
  class="lg:hidden fixed bottom-6 right-6 bg-red-600 hover:bg-red-500 text-white p-4 rounded-full shadow-lg z-[9999] flex items-center justify-center">
<span class="material-icons">add_shopping_cart</span>
  <span id="floating-cart-count" 
    class="absolute -top-1 -right-1 bg-white text-red-600 text-[16px] font-medium px-2 rounded-full hidden">0</span>
</button>
<!-- Floating Cart Content -->
<div id="floating-cart-panel" 
  class="hidden fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm flex justify-center items-center z-[10000]">
  <div id="cart-items" class="bg-gray-900 p-6 rounded-lg w-96 shadow-lg">
    <div class="flex justify-between items-center border-b border-gray-700 pb-3">
      <h2 class="text-lg text-gray-200 font-semibold">🛒 My Cart</h2>
      <button id="close-floating-cart" class="text-white text-2xl -mt-6">&times;</button>
    </div>
    <div id="floating-cart-items" class="space-y-2 max-h-[370px] overflow-y-auto p-3">
      <p class="text-gray-400 text-center">Your cart is empty.</p>
    </div>
    <div class="mt-3 border-t border-gray-700 pt-3">
      <p class="text-white font-semibold text-center">Total: <span id="floating-cart-total">P 0.00</span></p>
      <button id="floating-checkout-btn" 
        class="w-full mt-2 bg-red-600 hover:bg-red-500 text-white py-2 rounded-lg transition">Checkout</button>
    </div>
  </div>
</div>


  <!-- ===== Scripts ===== -->
  <script src="js/cart.js"></script>
  <script src="js/path.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/responsive.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/hamburger.js"></script>
  <script src="js/script.js"></script>
  <script src="js/foodmenu.js"></script>
  <script src="js/ourmenu.js"></script>




</body>
</html>
